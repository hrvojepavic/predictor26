<form class="kickoff-form" [formGroup]="kickoffForm" (ngSubmit)="confirm()">
  <header class="modal-header">
    <h2 id="kickoff-modal-title">{{ 'ui.edit_match_details' | translate }}</h2>
    <button class="icon-button" type="button" [attr.aria-label]="'ui.close' | translate" [title]="'ui.close' | translate" [disabled]="isSubmitting()" (click)="cancel()">×</button>
  </header>

  <div class="modal-content">
    <p class="match-label">{{ 'ui.match_p0_p1_vs_p2' | translate: { p0: (match().matchNumber), p1: (match().homeTeam.name), p2: (match().awayTeam.name) } }}</p>

    <label class="field">
      <span>{{ 'ui.match_date_and_time' | translate }}</span>
      <input type="datetime-local" autofocus appFormFieldState="invalid" formControlName="kickoffAt" [readonly]="isSubmitting()" />
    </label>

    <label class="field">
      <span>{{ 'ui.venue' | translate }}</span>
      <input
        type="text"
        maxlength="160"
        appFormFieldState="invalid"
        formControlName="venueDisplay"
        [readonly]="isSubmitting()"
      />
    </label>

    @if (canAddOdds()) {
      <fieldset class="odds-fields">
        <legend>{{ 'ui.add_odds' | translate }}</legend>

        <label class="field">
          <span>{{ 'ui.home_win' | translate }}</span>
          <input
            type="number"
            min="1.01"
            max="1000"
            step="0.01"
            inputmode="decimal"
            appFormFieldState="invalid"
            formControlName="homeWinOdds"
            [readonly]="isSubmitting()"
          />
        </label>

        <label class="field">
          <span>{{ 'ui.draw' | translate }}</span>
          <input
            type="number"
            min="1.01"
            max="1000"
            step="0.01"
            inputmode="decimal"
            appFormFieldState="invalid"
            formControlName="drawOdds"
            [readonly]="isSubmitting()"
          />
        </label>

        <label class="field">
          <span>{{ 'ui.away_win' | translate }}</span>
          <input
            type="number"
            min="1.01"
            max="1000"
            step="0.01"
            inputmode="decimal"
            appFormFieldState="invalid"
            formControlName="awayWinOdds"
            [readonly]="isSubmitting()"
          />
        </label>
      </fieldset>
    }

    <label class="field">
      <span>{{ 'ui.what_is_the_secret_code' | translate }}</span>
      <input
        type="password"
        autocomplete="current-password"
        maxlength="128"
        appFormFieldState="required"
        formControlName="secretCode"
        [readonly]="isSubmitting()"
      />
    </label>

    <p class="form-error" [class.form-error-visible]="errorMessage()">{{ (errorMessage() || ' ') }}</p>
  </div>

  <footer class="modal-footer">
    <button class="secondary-button" type="button" [disabled]="isSubmitting()" (click)="cancel()">{{ 'ui.cancel' | translate }}</button>
    <button class="confirm-button" type="submit" [disabled]="isSubmitting() || kickoffForm.invalid">
      {{ isSubmitting() ? ('ui.saving' | translate) : ('ui.save_changes' | translate) }}
    </button>
  </footer>
</form>
