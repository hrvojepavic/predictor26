<form class="username-form" [formGroup]="usernameForm" (ngSubmit)="confirm()">
  <header class="modal-header">
    <h2 id="username-modal-title">{{ 'ui.edit_username' | translate }}</h2>
    <button class="icon-button" type="button" [attr.aria-label]="'ui.close' | translate" [title]="'ui.close' | translate" [disabled]="isSubmitting()" (click)="cancel()">×</button>
  </header>

  <div class="modal-content">
    <label class="field">
      <span>{{ 'ui.username' | translate }}</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        maxlength="40"
        autofocus
        appFormFieldState="invalid"
        formControlName="username"
        [readonly]="isSubmitting()"
      />
    </label>

    <label class="field">
      <span>{{ 'ui.what_is_the_secret_code' | translate }}</span>
      <input
        type="password"
        autocomplete="current-password"
        maxlength="128"
        appFormFieldState="required"
        formControlName="secretCode"
        [readonly]="isSubmitting()"
      />
    </label>

    <p class="form-error" [class.form-error-visible]="errorMessage()">{{ (errorMessage() || ' ') }}</p>
  </div>

  <footer class="modal-footer">
    <button class="secondary-button" type="button" [disabled]="isSubmitting()" (click)="cancel()">{{ 'ui.cancel' | translate }}</button>
    <button class="confirm-button" type="submit" [disabled]="isSubmitting() || usernameForm.invalid">
      {{ isSubmitting() ? ('ui.saving' | translate) : ('ui.save_username' | translate) }}
    </button>
  </footer>
</form>
