<section class="home-page" [attr.aria-label]="'ui.rankings' | translate">
  <app-home-leaderboard />

  @if (showPaymentNotice()) {
    <button class="payment-notice" type="button" (click)="openPaymentModal()">
      {{ 'ui.payment_info' | translate }}
    </button>
  }

  @if (paymentModalOpen() && showPaymentNotice() && paymentInfo(); as info) {
    <app-modal-shell labelledBy="payment-info-title" panelWidth="520px"
      animate.enter="modal-enter" animate.leave="modal-leave" (closeModal)="closePaymentModal()">
      <app-payment-info-modal [methods]="info.methods" (closeModal)="closePaymentModal()" />
    </app-modal-shell>
  }
</section>
