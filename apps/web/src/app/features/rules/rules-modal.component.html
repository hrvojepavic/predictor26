<header class="modal-header">
  <h2 id="rules-title">{{ 'ui.rules' | translate }}</h2>
  <button class="icon-button" type="button" [attr.aria-label]="'ui.close_rules' | translate" [title]="'ui.close_rules' | translate" (click)="close()">×</button>
</header>

<div class="modal-content">
  <ul>
    @for (rule of rules(); track rule) {
      <li>{{ rule | localizedText }}</li>
    } @empty {
      <li>{{ 'ui.rules_could_not_be_loaded' | translate }}</li>
    }
  </ul>
</div>

<footer class="modal-footer">
  <button class="close-button" type="button" (click)="close()">{{ 'ui.close' | translate }}</button>
</footer>
